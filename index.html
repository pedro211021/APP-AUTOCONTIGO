<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a1015">
<title>AutoContigo</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eef2f5;--bg2:#e6ecf0;--panel:#ffffff;--panel2:#f3f6f8;--line:#dbe3e9;--line2:#c6d1d9;
  --text:#0d1a23;--mut:#586a77;--mut2:#8494a0;
  --brand:#ff6a2b;--brand-ink:#1c0d04;--brand-soft:rgba(255,106,43,.12);
  --ok:#0f9d6e;--warn:#b7791f;--bad:#d93a58;--info:#1d78c9;
  --ok-soft:rgba(15,157,110,.12);--warn-soft:rgba(224,150,20,.16);--bad-soft:rgba(217,58,88,.12);--info-soft:rgba(29,120,201,.12);
  --fd:'Bricolage Grotesque','Instrument Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --fb:'Instrument Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --r1:22px;--r2:14px;--r3:10px;--side:236px;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0a1015;--bg2:#0e161c;--panel:#131d25;--panel2:#1a2630;--line:#243440;--line2:#31444f;
  --text:#eaf1f5;--mut:#8ea0ad;--mut2:#62747f;--brand-soft:rgba(255,106,43,.14);
  --ok:#35d39a;--warn:#ffb627;--bad:#ff5470;--info:#59b8ff;
  --ok-soft:rgba(53,211,154,.13);--warn-soft:rgba(255,182,39,.14);--bad-soft:rgba(255,84,112,.14);--info-soft:rgba(89,184,255,.14)}}
:root[data-theme="dark"]{
  --bg:#0a1015;--bg2:#0e161c;--panel:#131d25;--panel2:#1a2630;--line:#243440;--line2:#31444f;
  --text:#eaf1f5;--mut:#8ea0ad;--mut2:#62747f;--brand-soft:rgba(255,106,43,.14);
  --ok:#35d39a;--warn:#ffb627;--bad:#ff5470;--info:#59b8ff;
  --ok-soft:rgba(53,211,154,.13);--warn-soft:rgba(255,182,39,.14);--bad-soft:rgba(255,84,112,.14);--info-soft:rgba(89,184,255,.14)}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--fb);font-size:15px;line-height:1.5;min-height:100vh;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
h1,h2,h3,h4{font-family:var(--fd);margin:0;letter-spacing:-.02em;line-height:1.1}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit;text-decoration:none}
.hidden{display:none!important}
:focus-visible{outline:2.5px solid var(--brand);outline-offset:2px;border-radius:8px}
::selection{background:var(--brand);color:var(--brand-ink)}
.ic{flex-shrink:0;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.num{font-variant-numeric:tabular-nums}
.mut{color:var(--mut)}.sm{font-size:12.5px}.xs{font-size:11.5px}
.row-flex{display:flex;align-items:center;gap:10px}.wrapf{flex-wrap:wrap}.grow{flex:1;min-width:0}.spread{justify-content:space-between}
.stack>*+*{margin-top:12px}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid transparent;border-radius:12px;padding:11px 18px;font-weight:600;font-size:14px;line-height:1.1;transition:transform .15s,background .15s,border-color .15s;white-space:nowrap}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--brand);color:var(--brand-ink)}
.btn.primary:hover{background:#ff7d45}
.btn.soft{background:var(--panel2);border-color:var(--line);color:var(--text)}
.btn.soft:hover{border-color:var(--line2)}
.btn.ghost{background:transparent;border-color:var(--line2);color:var(--text)}
.btn.bad{background:var(--bad-soft);color:var(--bad);border-color:color-mix(in srgb,var(--bad) 35%,transparent)}
.btn.ok{background:var(--ok-soft);color:var(--ok);border-color:color-mix(in srgb,var(--ok) 35%,transparent)}
.btn.s{padding:8px 12px;font-size:13px;border-radius:10px}
.btn.block{width:100%}
.btn[disabled]{opacity:.55;pointer-events:none}
.ibtn{width:40px;height:40px;display:grid;place-items:center;border-radius:12px;border:1px solid var(--line);background:var(--panel);position:relative}
.ibtn:hover{border-color:var(--line2)}
.badge{position:absolute;top:-5px;right:-5px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--bad);color:#fff;font-size:10.5px;font-weight:700;display:grid;place-items:center}

/* Cards & bits */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r1);padding:20px}
.card.tight{padding:14px;border-radius:var(--r2)}
.card h3{font-size:17px}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.pill{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:99px;font-size:11.5px;font-weight:600;background:var(--panel2);color:var(--mut);border:1px solid var(--line);white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.pill.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.pill.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.pill.info{background:var(--info-soft);color:var(--info);border-color:transparent}
.pill.brand{background:var(--brand-soft);color:var(--brand);border-color:transparent}
.dot{width:8px;height:8px;border-radius:50%;background:var(--mut2);flex-shrink:0}
.dot.ok{background:var(--ok)}.dot.warn{background:var(--warn)}.dot.bad{background:var(--bad)}
.bar{height:7px;border-radius:9px;background:var(--line);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:9px;background:var(--brand);transition:width .5s cubic-bezier(.2,.7,.2,1)}
.bar>i.ok{background:var(--ok)}.bar>i.warn{background:var(--warn)}.bar>i.bad{background:var(--bad)}
.seg{display:inline-flex;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:3px;gap:2px;max-width:100%;overflow-x:auto}
.seg button{border:0;background:none;padding:8px 14px;border-radius:9px;font-weight:600;font-size:13px;color:var(--mut);white-space:nowrap}
.seg button.on{background:var(--panel);color:var(--text);box-shadow:0 0 0 1px var(--line)}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.list{display:grid;gap:8px}
.item{display:flex;align-items:center;gap:12px;background:var(--panel2);border:1px solid var(--line);border-radius:var(--r2);padding:12px 14px;text-align:left;width:100%}
button.item:hover,a.item:hover{border-color:var(--line2)}
.item .t{font-weight:600;font-size:14px}
.item .s{font-size:12.5px;color:var(--mut)}
.chip-ic{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;background:var(--brand-soft);color:var(--brand);flex-shrink:0}
.chip-ic.ok{background:var(--ok-soft);color:var(--ok)}.chip-ic.warn{background:var(--warn-soft);color:var(--warn)}.chip-ic.bad{background:var(--bad-soft);color:var(--bad)}.chip-ic.info{background:var(--info-soft);color:var(--info)}
.empty{text-align:center;padding:26px 14px;color:var(--mut);border:1.5px dashed var(--line2);border-radius:var(--r2)}
.empty b{display:block;color:var(--text);font-family:var(--fd);font-size:16px;margin-bottom:4px}
.note{display:flex;gap:10px;align-items:flex-start;background:var(--info-soft);color:var(--text);border-radius:var(--r2);padding:12px 14px;font-size:13px}
.note .ic{color:var(--info);margin-top:2px}
.note.warn{background:var(--warn-soft)}.note.warn .ic{color:var(--warn)}
.note.bad{background:var(--bad-soft)}.note.bad .ic{color:var(--bad)}

/* Forms */
.field{display:block}
.field>span{display:block;font-size:12.5px;font-weight:600;color:var(--mut);margin-bottom:6px}
.inp{width:100%;background:var(--panel2);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;outline:none;transition:border-color .15s;min-height:46px}
.inp:focus{border-color:var(--brand)}
.inp.err{border-color:var(--bad)}
.inp-wrap{position:relative}
.inp-wrap .inp{padding-left:42px}
.inp-wrap>.ic{position:absolute;left:14px;top:13px;color:var(--mut2)}
.inp-wrap>button{position:absolute;right:6px;top:5px;width:36px;height:36px;border:0;background:none;color:var(--mut);border-radius:9px;display:grid;place-items:center}
.ferr{color:var(--bad);font-size:12.5px;margin-top:6px;min-height:0}
.fgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.fgrid .w{grid-column:1/-1}
input[type=range]{width:100%;accent-color:var(--brand);height:28px}
.check{display:flex;align-items:center;gap:10px;font-size:14px}
.check input{width:20px;height:20px;accent-color:var(--brand)}
.switch{position:relative;width:46px;height:28px;flex-shrink:0}
.switch input{position:absolute;inset:0;opacity:0;width:100%;height:100%;margin:0;cursor:pointer;z-index:1}
.switch i{position:absolute;inset:0;background:var(--line2);border-radius:99px;transition:.2s}
.switch i::after{content:"";position:absolute;left:3px;top:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.2s}
.switch input:checked+i{background:var(--brand)}
.switch input:checked+i::after{transform:translateX(18px)}
.switch input:focus-visible+i{outline:2.5px solid var(--brand);outline-offset:2px}

/* ===== Public screens ===== */
#pub{min-height:100vh}
.ptop{display:flex;align-items:center;justify-content:space-between;padding:16px max(20px,calc((100% - 1160px)/2))}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--fd);font-weight:800;font-size:19px;letter-spacing:-.03em;background:none;border:0;padding:0}
.brand .mk{width:34px;height:34px;border-radius:10px;background:var(--brand);color:var(--brand-ink);display:grid;place-items:center}
.brand b{color:var(--brand);font-weight:800}.brand .wd{white-space:nowrap}
.land{display:grid;grid-template-columns:1.05fr .95fr;gap:48px;align-items:center;width:min(1160px,calc(100% - 40px));margin:0 auto;padding:36px 0 56px}
.land h1{font-size:clamp(40px,6vw,72px);font-weight:800;letter-spacing:-.045em;line-height:.98}
.land h1 span{color:var(--mut)}
.land .lead{font-size:18px;color:var(--mut);max-width:520px;margin-top:20px}
.land .cta{display:flex;gap:10px;flex-wrap:wrap;margin-top:28px}
.land .cta .btn{padding:14px 22px;font-size:15px}
.cluster{background:linear-gradient(180deg,#0c141b,#101a22);border:1px solid #223440;border-radius:32px;padding:22px 22px 18px;position:relative;color:#eaf1f5}
.cluster .gv{width:100%;max-width:440px;margin:0 auto;display:block}
.cluster-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
.cluster-row div{background:rgba(255,255,255,.04);border:1px solid #223440;border-radius:14px;padding:10px 12px}
.cluster-row small{display:block;color:#8ea0ad;font-size:11.5px}
.cluster-row b{font-family:var(--fd);font-size:19px}
.cluster-row .ok{color:#35d39a}
.feats{width:min(1160px,calc(100% - 40px));margin:0 auto;padding:10px 0 70px;display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.feats article{border-top:2px solid var(--line2);padding-top:16px}
.feats article .ic{color:var(--brand);margin-bottom:10px}
.feats h3{font-size:18px;margin-bottom:6px}
.feats p{color:var(--mut);font-size:14px}
.pfoot{border-top:1px solid var(--line);padding:22px;text-align:center;color:var(--mut);font-size:12.5px}
.auth{display:grid;grid-template-columns:.9fr 1.1fr;min-height:calc(100vh - 20px)}
.auth-art{background:#0c141b;color:#eaf1f5;padding:36px;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden}
.auth-art h2{font-size:clamp(28px,3.2vw,42px);font-weight:800;letter-spacing:-.04em;max-width:11em}
.auth-art ul{list-style:none;padding:0;margin:22px 0 0;display:grid;gap:12px;color:#a9b8c3;font-size:14.5px}
.auth-art li{display:flex;gap:10px;align-items:flex-start}
.auth-art li .ic{color:var(--brand);margin-top:2px}
.auth-art .gv{position:absolute;right:-90px;bottom:-90px;width:380px;opacity:.28}
.auth-main{display:grid;place-items:center;padding:28px 20px}
.auth-box{width:min(410px,100%)}
.auth-box h1{font-size:32px;font-weight:800;letter-spacing:-.04em}
.auth-box .sub{color:var(--mut);margin:6px 0 22px}
.auth-box .field+.field{margin-top:14px}
.linkbtn{background:none;border:0;padding:0;color:var(--brand);font-weight:600}
.strength{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-top:8px}
.strength i{height:4px;border-radius:4px;background:var(--line)}
.divider{display:flex;align-items:center;gap:12px;color:var(--mut2);font-size:12px;margin:18px 0}
.divider::before,.divider::after{content:"";height:1px;background:var(--line);flex:1}
.wiz{width:min(620px,calc(100% - 32px));margin:0 auto;padding:22px 0 60px}
.steps{display:flex;gap:6px;margin:18px 0 26px}
.steps i{height:5px;border-radius:5px;background:var(--line);flex:1}
.steps i.on{background:var(--brand)}
.choice{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.choice button{background:var(--panel);border:2px solid var(--line);border-radius:var(--r1);padding:26px 14px;display:grid;justify-items:center;gap:10px;font-weight:700;font-family:var(--fd);font-size:18px}
.choice button.on{border-color:var(--brand);background:var(--brand-soft)}
.choice button .ic{color:var(--brand)}

/* ===== App shell ===== */
#shell{display:grid;grid-template-columns:var(--side) 1fr;min-height:100vh}
.side{position:sticky;top:0;height:100vh;align-self:start;padding:18px 14px;border-right:1px solid var(--line);background:var(--bg2);display:flex;flex-direction:column;gap:14px;overflow-y:auto}
.side .brand{padding:4px 8px 10px}
.nav{display:grid;gap:2px}
.nav a,.nav button{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;border:0;background:none;color:var(--mut);font-weight:600;font-size:14px;text-align:left;width:100%}
.nav a:hover,.nav button:hover{background:var(--panel2);color:var(--text)}
.nav a.on{background:var(--panel);color:var(--text);box-shadow:0 0 0 1px var(--line)}
.nav a.on .ic{color:var(--brand)}
.nav .sos{color:var(--bad)}
.nav-sec{font-size:11.5px;color:var(--mut2);font-weight:600;padding:12px 12px 4px}
.side-user{margin-top:auto;display:flex;align-items:center;gap:10px;padding:10px;border:1px solid var(--line);border-radius:14px;background:var(--panel)}
.avatar{width:36px;height:36px;border-radius:50%;background:var(--brand);color:var(--brand-ink);display:grid;place-items:center;font-family:var(--fd);font-weight:800;flex-shrink:0}
.main{min-width:0;padding-bottom:40px}
.topbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top,0px)) 24px 10px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.topbar .brand{display:none}
.vsw{display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:7px 12px;font-weight:600;font-size:13.5px;max-width:240px}
.vsw span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.screen{width:min(1080px,100%);margin:0 auto;padding:26px 24px 24px}
.phead{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:20px}
.phead h1{font-size:clamp(28px,4vw,38px);font-weight:800;letter-spacing:-.04em}
.phead p{color:var(--mut);margin-top:6px;max-width:56ch}
.phead .acts{display:flex;gap:8px;flex-wrap:wrap}
.backl{display:inline-flex;align-items:center;gap:6px;color:var(--mut);font-weight:600;font-size:13px;background:none;border:0;padding:0;margin-bottom:10px}
.tabbar{display:none}
.hgrid{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr);gap:16px;align-items:start}
.hgrid>div{display:grid;gap:16px}
.vhead{display:flex;align-items:center;gap:14px}
.vbadge{width:54px;height:54px;border-radius:16px;background:var(--brand);color:var(--brand-ink);display:grid;place-items:center;flex-shrink:0}
.vhead h2{font-size:24px;font-weight:800}
.health{display:grid;grid-template-columns:200px 1fr;gap:18px;align-items:center}
.factor{display:grid;grid-template-columns:96px 1fr 34px;gap:10px;align-items:center;font-size:13px}
.factor+.factor{margin-top:9px}
.factor b{font-variant-numeric:tabular-nums;text-align:right}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tile{display:grid;justify-items:start;gap:10px;padding:14px;border-radius:var(--r2);background:var(--panel2);border:1px solid var(--line);font-weight:600;font-size:13.5px;text-align:left}
.tile:hover{border-color:var(--brand)}
.tile .ic{color:var(--brand)}
.stat small{display:block;color:var(--mut);font-size:12.5px}
.stat strong{display:block;font-family:var(--fd);font-size:26px;letter-spacing:-.03em;margin-top:2px}
.tip{display:flex;gap:14px}
.tip h4{font-size:16px;margin-bottom:4px}
.tip p{color:var(--mut);font-size:13.5px}
.check-step{display:flex;align-items:center;gap:10px;font-size:13.5px;padding:6px 0}
.check-step .box{width:20px;height:20px;border-radius:6px;border:1.8px solid var(--line2);display:grid;place-items:center;color:var(--brand-ink);flex-shrink:0}
.check-step.done .box{background:var(--ok);border-color:var(--ok)}
.check-step.done span{color:var(--mut);text-decoration:line-through}

/* Gauge */
.gv{display:block;width:100%;height:auto}
.gv .trk{fill:none;stroke:var(--line);stroke-width:12;stroke-linecap:round}
.gv .val{fill:none;stroke-width:12;stroke-linecap:round;transition:stroke-dashoffset .8s cubic-bezier(.2,.7,.2,1),stroke .3s}
.gv .tick{stroke:var(--line2);stroke-width:2;stroke-linecap:round}
.gv .needle{transition:transform .8s cubic-bezier(.2,.7,.2,1);transform-box:view-box}
.gv text{font-family:var(--fd);fill:var(--text)}
.gv .lbl{fill:var(--mut);font-family:var(--fb)}
.cluster .gv .trk,.spd .gv .trk,.auth-art .gv .trk{stroke:#213340}.cluster .gv .tick,.spd .gv .tick,.auth-art .gv .tick{stroke:#33495a}.cluster .gv text,.spd .gv text,.auth-art .gv text{fill:#eaf1f5}.cluster .gv .lbl,.spd .gv .lbl,.auth-art .gv .lbl{fill:#8ea0ad}

/* GPS */
.gpsgrid{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:16px;align-items:start}
.mapbox{background:#0c141b;border:1px solid #223440;border-radius:var(--r1);overflow:hidden;position:relative}
.mapbox svg{display:block;width:100%;height:auto}
.mapbox .overlay{position:absolute;left:12px;top:12px;display:flex;gap:6px;flex-wrap:wrap}
.mapbox .overlay .pill{background:rgba(12,20,27,.85);color:#eaf1f5;border-color:#2a3d4b}
.spd{background:#0c141b;border:1px solid #223440;border-radius:var(--r1);padding:12px 16px 16px;color:#eaf1f5}
.kv{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:6px}
.kv div{background:rgba(255,255,255,.05);border:1px solid #223440;border-radius:12px;padding:9px 12px}
.kv small{display:block;color:#8ea0ad;font-size:11.5px}
.kv b{font-family:var(--fd);font-size:17px}
.pulse{animation:pulse 1.6s ease-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pulse{0%{transform:scale(.6);opacity:.9}100%{transform:scale(2.4);opacity:0}}
.srow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0}
.srow+.srow{border-top:1px solid var(--line)}

/* Lists specifics */
.mcard{display:grid;gap:10px}
.dcard{display:grid;grid-template-columns:64px 1fr auto;gap:14px;align-items:center}
.ring{position:relative;width:64px;height:64px}
.ring svg{width:64px;height:64px;transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--fd);font-size:15px}
.bars{display:flex;align-items:flex-end;gap:10px;height:140px;padding-top:8px}
.bars>div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:6px;height:100%}
.bars .b{width:100%;max-width:44px;border-radius:8px 8px 3px 3px;background:var(--line2);min-height:4px}
.bars .b.cur{background:var(--brand)}
.bars small{color:var(--mut);font-size:11px}
.legend{display:grid;gap:8px;font-size:13px}
.legend div{display:flex;align-items:center;gap:8px}
.legend i{width:10px;height:10px;border-radius:3px}
.legend b{margin-left:auto;font-variant-numeric:tabular-nums}
.donut{display:grid;grid-template-columns:150px 1fr;gap:18px;align-items:center}
details.lesson{background:var(--panel2);border:1px solid var(--line);border-radius:var(--r2);padding:0}
details.lesson summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:12px;padding:14px}
details.lesson summary::-webkit-details-marker{display:none}
details.lesson summary .chev{margin-left:auto;transition:transform .2s;color:var(--mut)}
details.lesson[open] summary .chev{transform:rotate(90deg)}
details.lesson .body{padding:0 16px 16px 64px;color:var(--mut);font-size:14px}
details.lesson .body ol,details.lesson .body ul{padding-left:18px;margin:8px 0}
details.lesson .body li{margin:4px 0}
details.lesson .body b{color:var(--text)}
.light{display:flex;gap:12px;align-items:flex-start;padding:12px;border-radius:var(--r2);background:var(--panel2);border:1px solid var(--line)}
.light .lb{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;flex-shrink:0;color:#fff}
.light .lb.r{background:#e5384f}.light .lb.y{background:#e6a10c}.light .lb.g{background:#1fa971}.light .lb.b{background:#2f86e0}
.sos-num{display:flex;align-items:center;gap:14px;padding:16px;border-radius:var(--r2);background:var(--bad-soft);border:1px solid color-mix(in srgb,var(--bad) 40%,transparent)}
.sos-num b{font-family:var(--fd);font-size:30px;color:var(--bad);letter-spacing:-.03em}
.step-n{width:28px;height:28px;border-radius:50%;background:var(--brand);color:var(--brand-ink);font-weight:800;display:grid;place-items:center;flex-shrink:0;font-family:var(--fd)}

/* Sheet & toast */
.sheet{position:fixed;inset:0;z-index:80;display:none}
.sheet.open{display:block}
.sheet .bd{position:absolute;inset:0;background:rgba(3,8,12,.6);animation:fade .2s}
.sheet .pn{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(520px,calc(100% - 24px));max-height:calc(100vh - 40px);overflow:auto;background:var(--panel);border:1px solid var(--line2);border-radius:26px;padding:22px;animation:pop .22s cubic-bezier(.2,.8,.3,1)}
.sheet .hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.sheet .hd h3{font-size:21px}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{from{opacity:0;transform:translate(-50%,-46%) scale(.97)}to{opacity:1;transform:translate(-50%,-50%)}}
.toast{position:fixed;z-index:120;left:50%;bottom:24px;transform:translate(-50%,30px);opacity:0;pointer-events:none;background:#0d1a23;color:#eaf1f5;border:1px solid #33495a;border-radius:14px;padding:11px 14px;font-size:13.5px;display:flex;gap:12px;align-items:center;transition:.25s;max-width:calc(100% - 24px);box-shadow:0 12px 40px rgba(0,0,0,.35)}
.toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast button{background:none;border:0;color:var(--brand);font-weight:700;padding:0}
.toast.bad{border-color:var(--bad)}

@media(max-width:1000px){
  #shell{grid-template-columns:1fr}
  .side{display:none}
  .topbar{padding-left:16px;padding-right:16px}
  .topbar .brand{display:flex}
  .topbar .brand .word{display:none}
  .tabbar{display:flex;position:fixed;bottom:0;left:0;right:0;z-index:40;background:color-mix(in srgb,var(--bg) 94%,transparent);backdrop-filter:blur(16px);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
  .tabbar a{flex:1;display:grid;justify-items:center;gap:2px;padding:6px 0;color:var(--mut);font-size:11px;font-weight:600;border-radius:12px}
  .tabbar a.on{color:var(--brand)}
  .main{padding-bottom:84px}
  .screen{padding:20px 16px}
  .hgrid,.gpsgrid{grid-template-columns:1fr}
  .land{grid-template-columns:1fr;gap:34px}
  .feats{grid-template-columns:repeat(2,1fr)}
  .auth{grid-template-columns:1fr}.auth-art{display:none}
  .toast{bottom:88px}
}
@media(max-width:620px){
  .g2,.g3,.g4{grid-template-columns:1fr}
  .g2.keep{grid-template-columns:repeat(2,minmax(0,1fr))}
  .health{grid-template-columns:1fr;justify-items:center}.health>div:last-child{width:100%}
  .tiles{grid-template-columns:repeat(2,1fr)}
  .fgrid{grid-template-columns:1fr}
  .donut{grid-template-columns:1fr;justify-items:center}.donut .legend{width:100%}
  .dcard{grid-template-columns:56px 1fr}.dcard .acts{grid-column:1/-1}
  .feats{grid-template-columns:1fr}
  .sheet .pn{top:auto;bottom:0;left:0;transform:none;width:100%;border-radius:26px 26px 0 0;animation:up .25s cubic-bezier(.2,.8,.3,1)}
  @keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
  .cluster-row b{font-size:16px}
  .vsw{max-width:150px}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}html{scroll-behavior:auto}}
</style>
</head>

    <header class="topbar" id="topbar"></header>
    <main class="screen" id="screen"></main>
  </div>
  <nav class="tabbar" id="tabbar" aria-label="Navegación principal"></nav>
</div>
<div id="sheet" class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
  <div class="bd" onclick="closeSheet()"></div>

</div>

<script>

async function sha(pass,salt){try{const b=new TextEncoder().encode(salt+":"+pass),h=await crypto.subtle.digest("SHA-256",b);return[...new Uint8Array(h)].map(x=>x.toString(16).padStart(2,"0")).join("")}catch{let h=5381;for(const c of salt+pass)h=((h<<5)+h+c.charCodeAt(0))|0;return"x"+h}}
const newSalt=()=>{try{return[...crypto.getRandomValues(new Uint8Array(8))].map(x=>x.toString(16).padStart(2,"0")).join("")}catch{return uid()}};
function setSession(s,remember){session=s;const j=JSON.stringify(s);LS.del("ac_session");try{sessionStorage.removeItem("ac_session")}catch{}
  if(remember)LS.set("ac_session",j);else try{sessionStorage.setItem("ac_session",j)}catch{LS.set("ac_session",j)}}
function readSession(){try{const a=sessionStorage.getItem("ac_session");if(a)return JSON.parse(a)}catch{}return readJSON("ac_session",null)}
function loadUserDb(fresh){const raw=readJSON(dbKey(),null);db=raw?ensureDb(raw):(fresh||emptyDB(newVehicle()));persist()}
const strength=p=>{let s=0;if(p.length>=8)s++;if(/[A-Z]/.test(p)&&/[a-z]/.test(p))s++;if(/\d/.test(p))s++;if(/[^A-Za-z0-9]/.test(p)||p.length>=12)s++;return p?Math.max(1,s):0};
let fails=0,lockUntil=0;
function ferr(id,msg){const e=$("#"+id+"Err"),i=$("#"+id);if(e)e.textContent=msg||"";if(i)i.classList.toggle("err",!!msg);return!msg}
function togglePass(id,btn){const i=$("#"+id),show=i.type==="password";i.type=show?"text":"password";btn.innerHTML=ic(show?"eyeoff":"eye");btn.setAttribute("aria-label",show?"Ocultar contraseña":"Mostrar contraseña")}
function passStrengthPaint(){const s=strength($("#aPass").value),c=["","var(--bad)","var(--warn)","var(--info)","var(--ok)"][s];$$("#aStr i").forEach((b,i)=>b.style.background=i<s?c:"");const l=$("#aStrL");if(l)l.textContent=["","Débil","Regular","Buena","Fuerte"][s]||""}
async function submitAuth(kind){
  const btn=$("#aBtn"),email=val("aEmail").toLowerCase(),pass=$("#aPass")?$("#aPass").value:"",name=val("aName");
  let ok=true;
  ok=ferr("aEmail",!email?"Escribe tu correo.":!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email)?"Revisa el formato del correo.":"")&&ok;
  if(kind==="register")ok=ferr("aName",!name?"Escribe tu nombre.":"")&&ok;
  ok=ferr("aPass",!pass?"Escribe tu contraseña.":pass.length<6?"Usa al menos 6 caracteres.":"")&&ok;
  if(!ok)return;
  if(Date.now()<lockUntil){ferr("aPass",`Demasiados intentos. Espera ${Math.ceil((lockUntil-Date.now())/1000)} s.`);return}
  btn.disabled=true;btn.textContent="Verificando…";
  const users=getUsers(),remember=$("#aRemember")?$("#aRemember").checked:true;
  try{
    if(kind==="register"){
      if(users[email]){ferr("aEmail","Ese correo ya tiene una cuenta. Inicia sesión.");return}
      const salt=newSalt();users[email]={name,salt,hash:await sha(pass,salt),created:todayStr()};setUsers(users);
      setSession({email,name},remember);loadUserDb(null);toast(`Cuenta creada. Bienvenido, ${name.split(" ")[0]}`);nav("onboarding");
    }else{
      const u=users[email];let good=false;
      if(u){ if(u.hash)good=(await sha(pass,u.salt))===u.hash; else if(u.pass!==undefined&&u.pass===pass){good=true;u.salt=newSalt();u.hash=await sha(pass,u.salt);delete u.pass;setUsers(users)} }
      if(!good){fails++;if(fails>=5){lockUntil=Date.now()+30000;fails=0}ferr("aPass","Correo o contraseña incorrectos.");return}
      fails=0;setSession({email,name:u.name},remember);loadUserDb(null);toast(`Hola de nuevo, ${u.name.split(" ")[0]}`);nav("home");
    }
  }finally{const b=$("#aBtn");if(b){b.disabled=false;b.textContent=kind==="register"?"Crear cuenta":"Iniciar sesión"}}
}
async function submitForgot(){
  const email=val("aEmail").toLowerCase(),pass=$("#aPass").value,users=getUsers();
  let ok=ferr("aEmail",!users[email]?"No encontramos una cuenta con ese correo.":"");
  ok=ferr("aPass",pass.length<6?"Usa al menos 6 caracteres.":"")&&ok;if(!ok)return;
  const salt=newSalt();users[email].salt=salt;users[email].hash=await sha(pass,salt);delete users[email].pass;setUsers(users);
  toast("Contraseña actualizada. Ya puedes iniciar sesión");nav("login");
}

/* ============ Hoja modal, avisos y confirmaciones ============ */
let lastFocus=null;
function sheet(title,html,after){lastFocus=document.activeElement;$("#sheetTitle").textContent=title;$("#sheetBody").innerHTML=html;$("#sheetX").innerHTML=ic("x");$("#sheet").classList.add("open");
  if(after)after();setTimeout(()=>{const f=$("#sheetBody input:not([type=checkbox]),#sheetBody select,#sheetBody button");f&&f.focus()},60)}
function closeSheet(){$("#sheet").classList.remove("open");lastFocus&&lastFocus.focus&&lastFocus.focus()}
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeSheet()});
function confirmSheet(title,msg,label,fn,danger=true){
  window.__conf=()=>{closeSheet();fn()};
  sheet(title,`<p class="mut">${msg}</p><div class="row-flex" style="justify-content:flex-end;margin-top:20px"><button class="btn soft" onclick="closeSheet()">Cancelar</button><button class="btn ${danger?"bad":"primary"}" onclick="__conf()">${label}</button></div>`);
}
let toastT=null,undoFn=null;
function toast(msg,{undo=null,bad=false}={}){
  const t=$("#toast");undoFn=undo;t.className="toast show"+(bad?" bad":"");t.innerHTML=`<span>${esc(msg)}</span>${undo?'<button onclick="doUndo()">Deshacer</button>':""}`;
  clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove("show"),undo?5500:3200);
}
function doUndo(){if(undoFn){undoFn();undoFn=null;$("#toast").classList.remove("show")}}
function removeItem(coll,id,label){
  const i=db[coll].findIndex(x=>x.id===id);if(i<0)return;const [it]=db[coll].splice(i,1);
  commit();toast(`${label} eliminado`,{undo:()=>{db[coll].splice(i,0,it);commit()}});
}

  sheet("Elige tu vehículo",`<div class="list">${db.vehicles.map(v=>`<button class="item" onclick="setActive('${v.id}')"><span class="chip-ic">${ic(VT[v.type].icon)}</span><div class="grow"><div class="t">${esc(vName(v))}</div><div class="s">${esc(v.plate||"Sin placa")} · ${nf(v.km)} km</div></div>${v.id===db.active?ic("check",18):""}</button>`).join("")}</div>
  <button class="btn soft block" style="margin-top:14px" onclick="closeSheet();nav('vehicles')">Administrar vehículos</button>`);

function setActive(id){db.active=id;closeSheet();commit()}

function render(){
  stopHero();
  let r=route();
  if(!session){
    showPub();
    if(r==="emergency")pubEmergency();else if(r==="login"||r==="register"||r==="forgot")pubAuth(r);else pubLanding();
    lastRoute=r;window.scrollTo(0,0);return;
  }
  if(!db.onboarded&&r!=="onboarding"){location.hash="#onboarding";return}
  if(r==="onboarding"){if(db.onboarded){location.hash="#home";return}showPub();pubOnboard();return}
  if(!SCREENS[r]){location.hash="#home";return}
  showShell();drawSide(r);drawTopbar();drawTabbar(r);
  $("#screen").innerHTML=SCREENS[r]();
  if(POST[r])POST[r]();
  if(r!==lastRoute){window.scrollTo(0,0);if(lastRoute==="gps"){db.gps.alerts.forEach(a=>a.seen=true);persist();drawTopbar()}}
  lastRoute=r;
}

POST.gps=()=>{paintGps()};
function removeTrip(id){const g=db.gps,i=g.trips.findIndex(t=>t.id===id);if(i<0)return;const [t]=g.trips.splice(i,1);commit();toast('Recorrido eliminado',{undo:()=>{g.trips.splice(i,0,t);commit()}})}
function gpsFence(v){const g=db.gps;g.fence=Number(v);const l=$("#fenceL");if(l)l.textContent=fmtDist(g.fence);const m=$("#mapInner");if(m)m.innerHTML=mapInner();GPS.inFence=g.pos?hav(g.base,g.pos)<=g.fence:true}
function gpsLimit(v){db.gps.limit=Number(v);const l=$("#limL");if(l)l.textContent=v+" km/h"}
function gpsWatch(on){const g=db.gps;g.watch=on;GPS.lock=on&&g.pos?{...g.pos}:null;persist();toast(on?"Vigilancia activa. Te avisaremos si se mueve con el motor apagado":"Vigilancia desactivada")}
function gpsSetBase(){const g=db.gps;if(!g.pos||(g.mode==="real"&&!g.pos.ts)){toast("Aún no hay una posición. Inicia un recorrido primero.",{bad:true});return}g.base={lat:g.pos.lat,lng:g.pos.lng};g.baseSet=true;g.trail=[];GPS.inFence=true;commit();toast("Base actualizada")}
function gpsTheft(){
  const g=db.gps;if(!g.watch){toast("Activa primero el modo vigilancia",{bad:true});return}
  if(tracking()){toast("Termina el recorrido para probar la alerta antirrobo",{bad:true});return}
  if(!GPS.lock)GPS.lock={...g.pos};g.engineOn=false;g.speed=0;
  const d=rnd(60,140),h=rnd(0,6.28),p=g.pos;processPos({lat:p.lat+d*Math.cos(h)/M_LAT,lng:p.lng+d*Math.sin(h)/mLng(p.lat),acc:9,ts:Date.now()});
}
function realLoc(){const g=db.gps;if(g.mode==="sim"){toast("Estás en modo simulado. Cambia a “GPS del teléfono” para usar tu ubicación real.",{bad:true});return null}
  if(!g.pos||!g.pos.ts){toast("Aún no hay una ubicación. Inicia un recorrido.",{bad:true});return null}return g.pos}
function gpsOpenMaps(){const p=realLoc();if(p)openUrl(`https://www.google.com/maps?q=${p.lat.toFixed(6)},${p.lng.toFixed(6)}`)}
function copyText(t,msg="Copiado"){try{navigator.clipboard.writeText(t).then(()=>toast(msg),()=>toast("No se pudo copiar",{bad:true}))}catch{toast("No se pudo copiar",{bad:true})}}
function gpsShare(){const p=realLoc();if(!p)return;const l=`https://www.google.com/maps?q=${p.lat.toFixed(6)},${p.lng.toFixed(6)}`;
  if(navigator.share)navigator.share({title:"Mi ubicación",text:"Estoy aquí:",url:l}).catch(()=>{});else copyText(l,"Enlace de ubicación copiado")}
function gpsPark(){const p=realLoc();if(!p)return;db.parking={place:"Última ubicación del rastreo",note:"",ts:new Date().toISOString(),lat:p.lat,lng:p.lng};commit(false);toast("Guardado en Estacionamiento");nav("parking")}

SCREENS.maintenance=function(){
  const v=V(),all=mine("maintenance"),pend=all.filter(m=>!m.done).sort((a,b)=>(a.km-v.km)-(b.km-v.km)),hist=all.filter(m=>m.done).sort((a,b)=>b.date.localeCompare(a.date));
  const sug=VT[v.type].presets.filter(p=>!pend.some(m=>m.title===p[0]));
  const tab=ui.mTab;
  let body="";
  if(tab==="pend")body=pend.length?`<div class="list">${pend.map(m=>{const s=mStatus(m),pr=m.interval?clamp((1-s.rem/m.interval)*100,3,100):null;
    return`<div class="card tight mcard"><div class="row-flex spread wrapf"><div class="row-flex"><span class="chip-ic ${s.lvl==="over"?"bad":s.lvl==="soon"?"warn":"ok"}">${ic("wrench")}</span><div><div class="t" style="font-weight:700">${esc(m.title)}</div>
      <div class="mut sm num">${s.rem<0?`Atrasado ${nf(-s.rem)} km`:`Faltan ${nf(s.rem)} km`}${m.date?` · ${fmtDate(m.date)}${s.dd!==null?` (${relDays(s.dd).toLowerCase()})`:""}`:""}${m.cost?` · ~${money(m.cost)}`:""}</div></div></div>
      <span class="pill ${lvlPill(s.lvl)}">${s.lvl==="over"?"Atrasado":s.lvl==="soon"?"Pronto":"Al día"}</span></div>
      ${pr!==null?`<div><div class="bar"><i class="${s.lvl==="over"?"bad":s.lvl==="soon"?"warn":"ok"}" style="width:${pr}%"></i></div><div class="xs mut" style="margin-top:4px">${Math.round(pr)}% del intervalo de ${nf(m.interval)} km</div></div>`:""}
      <div class="row-flex wrapf"><button class="btn ok s" onclick="doneSheet('${m.id}')">${ic("check",16)}Marcar como hecho</button><button class="btn soft s" onclick="maintSheet('${m.id}')">${ic("edit",16)}Editar</button><button class="btn soft s" onclick="removeItem('maintenance','${m.id}','Servicio')">${ic("trash",16)}Eliminar</button></div></div>`}).join("")}</div>`
    :`<div class="empty"><b>No tienes servicios programados</b>Agrega uno o elige entre los sugeridos para tu ${VT[v.type].label.toLowerCase()}.<div style="margin-top:14px"><button class="btn soft s" onclick="ui.mTab='sug';render()">Ver sugeridos</button></div></div>`;
  if(tab==="hist")body=hist.length?`<div class="row-flex spread" style="margin-bottom:12px"><span class="mut sm">${hist.length} servicios realizados</span><span class="pill">Total invertido ${money(hist.reduce((a,m)=>a+m.cost,0))}</span></div><div class="list">${hist.map(m=>`<div class="item"><span class="chip-ic ok">${ic("check")}</span><div class="grow"><div class="t">${esc(m.title)}</div><div class="s num">${fmtDate(m.date)} · ${nf(m.km)} km${m.cost?` · ${money(m.cost)}`:""}${m.workshop?` · ${esc(m.workshop)}`:""}</div></div><button class="ibtn" style="width:34px;height:34px" onclick="removeItem('maintenance','${m.id}','Registro')" aria-label="Eliminar">${ic("trash",16)}</button></div>`).join("")}</div>`
    :`<div class="empty"><b>Aún no hay historial</b>Cuando marques un servicio como hecho aparecerá aquí con su costo y kilometraje.</div>`;
  if(tab==="sug")body=`<div class="note" style="margin-bottom:12px">${ic("info",18)}<div>Son intervalos habituales. Tu manual puede indicar otros valores: ajústalos al agregar cada servicio.</div></div>
    <div class="list">${sug.length?sug.map(([t,i])=>`<div class="item"><span class="chip-ic">${ic("wrench")}</span><div class="grow"><div class="t">${t}</div><div class="s">Cada ${nf(i)} km · te tocaría a los ${nf(v.km+i)} km</div></div><button class="btn primary s" onclick="addPreset('${esc(t)}',${i})">Agregar</button></div>`).join(""):`<div class="empty"><b>Ya programaste todos</b>Buen trabajo.</div>`}</div>`;
  return`${phead("Mantenimiento",`Tu ${esc(vName(v))} está en <b class="num" style="color:var(--text)">${nf(v.km)} km</b>.`,`<button class="btn soft" onclick="kmSheet()">Actualizar km</button><button class="btn primary" onclick="maintSheet()">${ic("plus",18)}Nuevo servicio</button>`)}
  <div class="seg" style="margin-bottom:16px" role="tablist"><button class="${tab==="pend"?"on":""}" onclick="ui.mTab='pend';render()">Pendientes${pend.length?` (${pend.length})`:""}</button><button class="${tab==="hist"?"on":""}" onclick="ui.mTab='hist';render()">Historial</button><button class="${tab==="sug"?"on":""}" onclick="ui.mTab='sug';render()">Sugeridos</button></div>${body}`;

function addPreset(t,i){const v=V();db.maintenance.push({id:uid(),vid:v.id,title:t,km:v.km+i,date:"",cost:0,workshop:"",done:false,interval:i});ui.mTab="pend";commit();toast(`${t} programado`)}

function saveMaint(id){
  const t=val("m_t");if(!t){$("#mErr").textContent="Escribe el nombre del servicio.";return}
  const o={title:t,km:Number(val("m_km"))||0,interval:Number(val("m_int"))||0,date:val("m_d"),cost:Number(val("m_c"))||0,workshop:val("m_w")};
  if(id)Object.assign(db.maintenance.find(x=>x.id===id),o);else db.maintenance.push({id:uid(),vid:V().id,done:false,...o});
  closeSheet();ui.mTab="pend";commit();toast("Servicio guardado");

function doneSheet(id){
  const m=db.maintenance.find(x=>x.id===id),v=V();
  sheet("Marcar como hecho",`<p class="mut" style="margin-bottom:14px"><b style="color:var(--text)">${esc(m.title)}</b></p><div class="fgrid">
   <label class="field"><span>Kilometraje al hacerlo</span><input class="inp" id="dn_km" type="number" inputmode="numeric" value="${v.km}"></label>
   <label class="field"><span>Fecha</span><input class="inp" id="dn_d" type="date" value="${todayStr()}"></label>
   <label class="field"><span>Costo real</span><input class="inp" id="dn_c" type="number" inputmode="numeric" value="${m.cost||""}" placeholder="0"></label>
   <label class="field"><span>Taller</span><input class="inp" id="dn_w" value="${esc(m.workshop)}"></label>
   <label class="check w" style="grid-column:1/-1"><input type="checkbox" id="dn_e" checked>Registrar el costo en Gastos</label>
   ${m.interval?`<label class="check w" style="grid-column:1/-1"><input type="checkbox" id="dn_r" checked>Programar el siguiente en ${nf(m.interval)} km</label>`:""}</div>
   <div class="row-flex" style="justify-content:flex-end;margin-top:18px"><button class="btn soft" onclick="closeSheet()">Cancelar</button><button class="btn primary" onclick="saveDone('${id}')">Guardar</button></div>`);
}
function saveDone(id){
  const m=db.maintenance.find(x=>x.id===id),v=V(),km=Number(val("dn_km"))||v.km,cost=Number(val("dn_c"))||0,date=val("dn_d")||todayStr();
  Object.assign(m,{done:true,km,date,cost,workshop:val("dn_w")});
  if(km>v.km)v.km=km;
  if($("#dn_e").checked&&cost>0)db.expenses.push({id:uid(),vid:v.id,date,cat:"Mantenimiento",amount:cost,note:m.title,qty:0,odo:0});
  if($("#dn_r")&&$("#dn_r").checked)db.maintenance.push({id:uid(),vid:v.id,title:m.title,km:km+m.interval,date:"",cost:m.cost,workshop:m.workshop,done:false,interval:m.interval});
  closeSheet();commit();toast("Servicio registrado en tu historial");
}

/* ---- Gastos ---- */
function donutSVG(items,total){
  const C=2*Math.PI*54;let off=0;
  return`<div style="position:relative;width:150px;height:150px"><svg viewBox="0 0 140 140" width="150" height="150" style="transform:rotate(-90deg)" role="img" aria-label="Gasto por categoría"><circle cx="70" cy="70" r="54" fill="none" stroke="var(--line)" stroke-width="18"/>
  ${items.map(([k,x])=>{const l=C*x/total,s=`<circle cx="70" cy="70" r="54" fill="none" stroke="${CATS[k]||"#8ea0ad"}" stroke-width="18" stroke-dasharray="${l.toFixed(2)} ${(C-l).toFixed(2)}" stroke-dashoffset="${(-off).toFixed(2)}"/>`;off+=l;return s}).join("")}</svg>
  <div style="position:absolute;inset:0;display:grid;place-items:center;text-align:center"><div><div class="xs mut">Total</div><b style="font-family:var(--fd);font-size:17px" class="num">${money(total)}</b></div></div></div>`;
}
SCREENS.expenses=function(){
  const all=mine("expenses").slice().sort((a,b)=>b.date.localeCompare(a.date)),now=new Date(),p=ui.ePeriod;
  const inP=e=>p==="all"||(p==="month"?monthKey(e.date)===`${now.getFullYear()}-${pad(now.getMonth()+1)}`:e.date>=addDays(-180));
  const list=all.filter(inP),total=list.reduce((a,e)=>a+e.amount,0);
  const byCat={};list.forEach(e=>byCat[e.cat]=(byCat[e.cat]||0)+e.amount);
  const cats=Object.entries(byCat).sort((a,b)=>b[1]-a[1]);
  const months=[];for(let i=5;i>=0;i--){const d=new Date();d.setMonth(d.getMonth()-i,1);months.push([MONTHS[d.getMonth()],monthSpend(i),i===0])}
  const mx=Math.max(1,...months.map(m=>m[1])),bud=db.profile.budget,sp=monthSpend(0),eff=fuelEff();
  const avgM=avg(months.filter(m=>m[1]>0).map(m=>m[1]));
  return`${phead("Gastos","Cuánto cuesta de verdad mantener tu vehículo.",`<button class="btn soft" onclick="exportCSV()">${ic("dl",18)}Exportar</button><button class="btn primary" onclick="expenseSheet()">${ic("plus",18)}Registrar gasto</button>`)}
  <div class="grid g3" style="margin-bottom:16px">
    <div class="card tight stat"><small>Este mes</small><strong class="num">${money(sp)}</strong>${bud>0?`<div class="bar" style="margin-top:8px"><i class="${sp>bud?"bad":sp>bud*.8?"warn":"ok"}" style="width:${clamp(sp/bud*100,2,100)}%"></i></div><small style="margin-top:4px">${sp>bud?`Superaste el presupuesto por ${money(sp-bud)}`:`Te quedan ${money(bud-sp)} de ${money(bud)}`}</small>`:`<small style="margin-top:4px"><a class="linkbtn" href="#profile">Definir presupuesto mensual</a></small>`}</div>
    <div class="card tight stat"><small>Promedio mensual</small><strong class="num">${avgM?money(avgM):"—"}</strong><small style="margin-top:4px">Últimos 6 meses con gastos</small></div>
    <div class="card tight stat"><small>Rendimiento de combustible</small><strong class="num">${eff?eff.toFixed(1)+" km/gal":"—"}</strong><small style="margin-top:4px">${eff?"Calculado con tus tanqueos":"Anota galones y odómetro al tanquear"}</small></div></div>
  <div class="grid g2" style="align-items:start;margin-bottom:16px">
    <section class="card"><div class="card-head"><h3>Últimos 6 meses</h3></div><div class="bars">${months.map(([l,v,c])=>`<div><small class="num">${v?Math.round(v/1000)+"k":""}</small><div class="b ${c?"cur":""}" style="height:${Math.max(4,v/mx*96)}px" title="${money(v)}"></div><small>${l}</small></div>`).join("")}</div></section>
    <section class="card"><div class="card-head"><h3>Por categoría</h3><div class="seg"><button class="${p==="month"?"on":""}" onclick="ui.ePeriod='month';render()">Mes</button><button class="${p==="6m"?"on":""}" onclick="ui.ePeriod='6m';render()">6 meses</button><button class="${p==="all"?"on":""}" onclick="ui.ePeriod='all';render()">Todo</button></div></div>
      ${cats.length?`<div class="donut">${donutSVG(cats,total)}<div class="legend">${cats.map(([k,x])=>`<div><i style="background:${CATS[k]||"#8ea0ad"}"></i>${k}<b>${money(x)}</b></div>`).join("")}</div></div>`:`<div class="empty"><b>Sin gastos en este periodo</b>Registra uno para ver el desglose.</div>`}</section></div>
  <section class="card"><div class="card-head"><h3>Movimientos</h3><span class="pill">${list.length}</span></div><div class="list">${list.length?list.map(e=>`<div class="item"><span class="chip-ic" style="background:${CATS[e.cat]||"#8ea0ad"}22;color:${CATS[e.cat]||"#8ea0ad"}">${ic(e.cat==="Combustible"?"fuel":e.cat==="Mantenimiento"?"wrench":e.cat==="Seguro"?"shield":"wallet")}</span><div class="grow"><div class="t">${esc(e.note||e.cat)}</div><div class="s">${e.cat} · ${fmtDate(e.date)}${e.qty?` · ${e.qty} gal`:""}</div></div><b class="num">${money(e.amount)}</b>
    <button class="ibtn" style="width:34px;height:34px" onclick="expenseSheet('${e.id}')" aria-label="Editar">${ic("edit",16)}</button><button class="ibtn" style="width:34px;height:34px" onclick="removeItem('expenses','${e.id}','Gasto')" aria-label="Eliminar">${ic("trash",16)}</button></div>`).join(""):`<div class="empty"><b>Sin movimientos</b>Toca “Registrar gasto” para empezar.</div>`}</div></section>`;
};

function saveExpense(id){

  const c=val("e_c"),o={date:val("e_d")||todayStr(),cat:c,amount:a,note:val("e_n"),qty:c==="Combustible"?Number(val("e_q"))||0:0,odo:c==="Combustible"&&val("e_q")?Number(val("e_o"))||0:0};

function exportCSV(){
  const rows=[["Fecha","Vehículo","Categoría","Monto","Descripción","Galones","Odómetro"]];
  db.expenses.slice().sort((a,b)=>a.date.localeCompare(b.date)).forEach(e=>{const v=db.vehicles.find(x=>x.id===e.vid);rows.push([e.date,v?vName(v):"",e.cat,e.amount,e.note||"",e.qty||"",e.odo||""])});
  exportSheet("Exportar gastos",rows.map(r=>r.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(",")).join("\n"),"autocontigo-gastos.csv");

function exportSheet(title,text,file){
  window.__exp=text;window.__expf=file;
  sheet(title,`<p class="mut sm" style="margin-bottom:10px">Copia el contenido o descárgalo como archivo.</p><textarea class="inp" readonly rows="9" style="font-family:ui-monospace,monospace;font-size:12px" onfocus="this.select()">${esc(text)}</textarea>
  <div class="row-flex" style="justify-content:flex-end;margin-top:16px"><button class="btn soft" onclick="copyText(__exp,'Copiado al portapapeles')">Copiar</button><button class="btn primary" onclick="downloadText()">${ic("dl",18)}Descargar</button></div>`);

function downloadText(){try{const b=new Blob([window.__exp],{type:"text/plain;charset=utf-8"}),u=URL.createObjectURL(b),a=document.createElement("a");a.href=u;a.download=window.__expf;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),2000);toast("Descarga iniciada. Si no ocurre, usa Copiar")}catch{toast("No se pudo descargar. Usa Copiar",{bad:true})}}

const DIAG=[["battery","Batería","battery",[[50,"Haz probar la batería pronto: puede dejarte varado."],[70,"Empieza a perder carga. Evita dejar luces encendidas y prográmala para revisión."],[101,"Buen estado. Un viaje largo de vez en cuando ayuda a mantenerla."]]],
 ["tires","Llantas","tire",[[50,"Revisa presión y desgaste hoy: es un tema de seguridad."],[70,"Verifica presión y busca desgaste desigual. Considera alinear y rotar."],[101,"Se ven bien. Revisa la presión en frío una vez al mes."]]],
 ["engine","Motor","engine",[[50,"Llévalo a revisión antes de continuar usándolo."],[70,"Vigila ruidos, humo y temperatura. Programa una revisión."],[101,"Sin señales de alerta en esta lectura."]]]];
SCREENS.diagnostic=function(){
  const v=V(),d=v.diag;
  return`${phead("Diagnóstico","Una lectura orientativa del estado general.",`<button class="btn soft" onclick="diagSheet()">${ic("edit",18)}Ajustar manualmente</button><button class="btn primary" onclick="runDiag()">${ic("refresh",18)}Ejecutar lectura</button>`)}
  <div class="note warn" style="margin-bottom:16px">${ic("info",18)}<div><b>Lectura de demostración.</b> No usa sensores reales ni reemplaza un escáner OBD-II o una revisión profesional. ${d.scanned?`Última lectura: ${fmtDT(d.scanned)}.`:"Aún no has ejecutado una lectura."}</div></div>
  <div class="grid g3">${DIAG.map(([k,n,i,adv])=>{const x=d[k],a=adv.find(r=>x<r[0])[1],l=lvlColor(x);return`<section class="card" style="text-align:center">${gaugeSVG("dg"+k,x,100,{unit:"%",label:n,color:`var(--${l})`,size:""})}<span class="pill ${l}">${x<50?"Revisar":x<70?"Atención":"Normal"}</span><p class="mut sm" style="margin-top:12px;text-align:left">${a}</p></section>`}).join("")}</div>
  <section class="card" style="margin-top:16px"><h3 style="margin-bottom:10px">Cuándo ir directo al taller</h3><ul class="mut sm" style="margin:0;padding-left:18px;display:grid;gap:6px"><li>Luz de aceite o de temperatura encendida en rojo.</li><li>Humo, olor a quemado o ruidos metálicos.</li><li>El pedal de freno se siente blando o el vehículo se va hacia un lado al frenar.</li></ul></section>`;

function runDiag(){const d=V().diag;d.battery=Math.floor(55+Math.random()*45);d.tires=Math.floor(50+Math.random()*50);d.engine=Math.floor(65+Math.random()*35);d.scanned=new Date().toISOString();commit();toast("Lectura simulada actualizada")}
function diagSheet(){const d=V().diag;
  sheet("Ajustar manualmente",`<p class="mut sm" style="margin-bottom:10px">Ingresa tu propia estimación, por ejemplo tras una revisión en taller.</p>${DIAG.map(([k,n])=>`<div style="margin-bottom:12px"><div class="row-flex spread"><b class="sm">${n}</b><span class="pill num" id="dv_${k}">${d[k]}%</span></div><input type="range" min="0" max="100" value="${d[k]}" id="di_${k}" oninput="$('#dv_${k}').textContent=this.value+'%'" aria-label="${n}"></div>`).join("")}

function saveDiag(){const d=V().diag;DIAG.forEach(([k])=>d[k]=Number($("#di_"+k).value));d.scanned=new Date().toISOString();closeSheet();commit();toast("Valores actualizados")}

SCREENS.routes=function(){
  const v=V(),modes=[["driving","Vehículo"],["two-wheeler","Moto"],["walking","A pie"],["transit","Transporte público"]];
  if(ui.rMode==="driving"&&v.type==="moto"&&!ui._rm){ui.rMode="two-wheeler"}

    <div class="row-flex wrapf" style="margin-top:14px"><div class="seg">${modes.map(([k,l])=>`<button class="${ui.rMode===k?"on":""}" onclick="ui._rm=1;ui.rMode='${k}';render()">${l}</button>`).join("")}</div></div>
    <div class="row-flex wrapf" style="margin-top:16px"><button class="btn primary" onclick="openRoute()">${ic("route",18)}Abrir ruta</button><button class="btn soft" onclick="savePlace()">${ic("plus",18)}Guardar destino</button></div></section>
  <section class="card" style="margin-top:16px"><div class="card-head"><h3>Lugares guardados</h3></div><div class="list">${db.places.length?db.places.map(p=>`<div class="item"><span class="chip-ic">${ic("pin")}</span><button class="grow" style="background:none;border:0;text-align:left;padding:0" onclick="ui.rDest='${esc(p.addr).replace(/'/g,"\\'")}';render()"><div class="t">${esc(p.name)}</div><div class="s">${esc(p.addr)}</div></button><button class="btn soft s" onclick="ui.rDest='${esc(p.addr).replace(/'/g,"\\'")}';openRoute()">Ir</button><button class="ibtn" style="width:34px;height:34px" onclick="removeItem('places','${p.id}','Lugar')" aria-label="Eliminar">${ic("trash",16)}</button></div>`).join(""):`<div class="empty"><b>Aún no guardas lugares</b>Escribe un destino y toca “Guardar destino”.</div>`}</div></section>`;
};
function openRoute(){const d=val("rDest");if(!d){toast("Escribe un destino",{bad:true});return}openUrl(`https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(d)}&travelmode=${ui.rMode}`)}
function savePlace(){const d=val("rDest");if(!d){toast("Escribe un destino para guardarlo",{bad:true});return}
  sheet("Guardar destino",`<label class="field"><span>Nombre del lugar</span><input class="inp" id="pl_n" placeholder="Ej. Casa de mis papás"></label><p class="mut sm" style="margin-top:10px">${esc(d)}</p>

SCREENS.equipment=function(){

function toggleEquip(id){const x=db.equipment.find(e=>e.id===id);x.ok=!x.ok;commit()}

/* ---- Estacionamiento ---- */
SCREENS.parking=function(){
  const p=db.parking;
  const mins=p?Math.max(0,Math.round((Date.now()-new Date(p.ts))/60000)):0,el=mins<60?`${mins} min`:`${Math.floor(mins/60)} h ${mins%60} min`;
  return`${phead("Estacionamiento","Guarda dónde lo dejaste y vuelve sin dar vueltas.")}
  ${p?`<section class="card" style="margin-bottom:16px"><div class="row-flex"><span class="vbadge">${ic("parking",28)}</span><div class="grow"><h3 style="font-size:20px">${esc(p.place||"Ubicación guardada")}</h3><div class="mut sm">Hace ${el} · ${fmtDT(p.ts)}</div>${p.note?`<div class="sm" style="margin-top:4px">${esc(p.note)}</div>`:""}</div></div>
    <div class="row-flex wrapf" style="margin-top:16px">${p.lat!=null?`<button class="btn primary" onclick="openUrl('https://www.google.com/maps/dir/?api=1&destination=${p.lat},${p.lng}&travelmode=walking')">${ic("route",18)}Cómo llegar a pie</button><button class="btn soft" onclick="openUrl('https://www.google.com/maps?q=${p.lat},${p.lng}')">${ic("pin",18)}Ver en mapa</button><button class="btn soft" onclick="copyText('https://www.google.com/maps?q=${p.lat},${p.lng}','Enlace copiado')">${ic("share",18)}Copiar enlace</button>`:`<span class="pill warn">Sin coordenadas: solo referencia escrita</span>`}
    <button class="btn bad" onclick="db.parking=null;commit();toast('Ubicación borrada')">${ic("trash",18)}Borrar</button></div></section>`:""}
  <section class="card"><h3 style="margin-bottom:12px">${p?"Guardar otra ubicación":"Guardar dónde estacioné"}</h3><div class="stack">
    <label class="field"><span>Referencia del lugar</span><input class="inp" id="p_place" placeholder="Ej. Parqueadero Centro Andino, piso 3"></label>
    <label class="field"><span>Nota (opcional)</span><input class="inp" id="p_note" placeholder="Ej. Columna B4"></label></div>
    <button class="btn primary" style="margin-top:16px" onclick="saveParking()">${ic("pin",18)}Guardar con mi ubicación actual</button>
    <p class="xs mut" style="margin-top:10px">Si permites la ubicación, guardamos las coordenadas para que puedas volver caminando. Si no, se guarda solo tu referencia escrita.</p></section>`;
};
function saveParking(){
  const place=val("p_place"),note=val("p_note"),fin=(la,lo)=>{db.parking={place:place||"Ubicación guardada",note,ts:new Date().toISOString(),lat:la,lng:lo};commit();toast(la!=null?"Ubicación guardada con coordenadas":"Guardado sin coordenadas")};
  if(!navigator.geolocation){fin(null,null);return}
  toast("Obteniendo tu ubicación…");
  navigator.geolocation.getCurrentPosition(p=>fin(+p.coords.latitude.toFixed(6),+p.coords.longitude.toFixed(6)),()=>fin(null,null),{enableHighAccuracy:true,timeout:9000});
}

  <label class="field"><span>Año</span><input class="inp" id="v_y" type="number" value="${v.year}"></label><label class="field"><span>Placa</span><input class="inp" id="v_p" value="${esc(v.plate)}" maxlength="7" style="text-transform:uppercase"></label>

function pickType(t){const s=$("#v_type");s.dataset.v=t;[...s.children].forEach((b,i)=>b.classList.toggle("on",(i===0)===(t==="car")))}
function saveVehicle(id){
  const b=val("v_b"),m=val("v_m");if(!b||!m){$("#vErr").textContent="Escribe la marca y el modelo.";return}
  const o={type:$("#v_type").dataset.v,brand:b,model:m,year:Number(val("v_y"))||new Date().getFullYear(),plate:val("v_p").toUpperCase(),km:Number(val("v_k"))||0,fuel:val("v_f"),color:val("v_c")};
  if(id)Object.assign(db.vehicles.find(x=>x.id===id),o);else{const v=newVehicle(o);db.vehicles.push(v);db.active=v.id}
  closeSheet();commit();toast("Vehículo guardado");
}
function delVehicle(id){const v=db.vehicles.find(x=>x.id===id);confirmSheet("Eliminar vehículo",`Se eliminará <b>${esc(vName(v))}</b> junto con su mantenimiento, gastos y documentos. Esta acción no se puede deshacer.`,"Eliminar",()=>{
  db.vehicles=db.vehicles.filter(x=>x.id!==id);["maintenance","expenses","documents"].forEach(k=>db[k]=db[k].filter(x=>x.vid!==id));if(db.active===id)db.active=db.vehicles[0].id;commit();toast("Vehículo eliminado")})}

/* ---- Perfil y datos ---- */
SCREENS.profile=function(){
  const p=db.profile,th=LS.get("ac_theme");
  return`${phead("Perfil y datos","Tu cuenta, tus preferencias y tus copias de seguridad.")}
  <div class="grid g2" style="align-items:start">
  <section class="card"><h3 style="margin-bottom:14px">Cuenta</h3><div class="row-flex" style="margin-bottom:14px"><div class="avatar" style="width:48px;height:48px;font-size:20px">${esc((session.name||"C")[0].toUpperCase())}</div><div><div style="font-weight:700">${esc(session.name)}</div><div class="mut sm">${esc(session.email)}</div></div></div>
    ${session.demo?`<div class="note" style="margin-bottom:14px">${ic("info",18)}<div>Estás en modo demo. Crea una cuenta para guardar tus propios datos.</div></div>`:""}
    <div class="row-flex wrapf"><button class="btn soft s" onclick="pwSheet()" ${session.demo?"disabled":""}>Cambiar contraseña</button><button class="btn soft s" onclick="logout()">Cerrar sesión</button></div></section>
  <section class="card"><h3 style="margin-bottom:14px">Emergencia y presupuesto</h3><div class="stack">
    <label class="field"><span>Contacto de confianza</span><input class="inp" id="pf_cn" value="${esc(p.contactName)}" placeholder="Nombre"></label>
    <label class="field"><span>Teléfono del contacto</span><input class="inp" id="pf_cp" type="tel" inputmode="tel" value="${esc(p.contactPhone)}" placeholder="3001234567"></label>
    <label class="field"><span>Presupuesto mensual del vehículo (COP)</span><input class="inp" id="pf_b" type="number" inputmode="numeric" value="${p.budget||""}" placeholder="Ej. 450000"></label></div>
    <button class="btn primary" style="margin-top:16px" onclick="saveProfile()">Guardar</button></section>
  <section class="card"><h3 style="margin-bottom:14px">Apariencia</h3><div class="seg"><button class="${!th?"on":""}" onclick="setTheme('')">Sistema</button><button class="${th==="light"?"on":""}" onclick="setTheme('light')">Claro</button><button class="${th==="dark"?"on":""}" onclick="setTheme('dark')">Oscuro</button></div></section>
  <section class="card"><h3 style="margin-bottom:6px">Tus datos</h3><p class="mut sm" style="margin-bottom:14px">Se guardan solo en este navegador. Haz copias de seguridad de vez en cuando.</p>
    <div class="row-flex wrapf"><button class="btn soft s" onclick="exportAll()">${ic("dl",16)}Exportar copia</button><button class="btn soft s" onclick="importSheet()">${ic("ul",16)}Importar copia</button><button class="btn soft s" onclick="exportCSV()">Gastos en CSV</button></div>
    <div class="row-flex wrapf" style="margin-top:14px"><button class="btn bad s" onclick="wipeData()">Borrar mis datos</button>${session.demo?"":`<button class="btn bad s" onclick="deleteAccount()">Eliminar cuenta</button>`}</div></section></div>`;
};
function saveProfile(){const p=db.profile;p.contactName=val("pf_cn");p.contactPhone=val("pf_cp");p.budget=Number(val("pf_b"))||0;commit();toast("Perfil guardado")}
function setTheme(t){if(t){document.documentElement.setAttribute("data-theme",t);LS.set("ac_theme",t)}else{document.documentElement.removeAttribute("data-theme");LS.del("ac_theme")}drawTopbar();render()}
function exportAll(){exportSheet("Copia de seguridad",JSON.stringify({app:"AutoContigo",version:3,exported:new Date().toISOString(),db},null,2),"autocontigo-copia.json")}
function importSheet(){sheet("Importar copia",`<p class="mut sm" style="margin-bottom:10px">Pega aquí el contenido de una copia exportada. <b>Reemplazará tus datos actuales.</b></p><textarea class="inp" id="imp" rows="8" placeholder='{"app":"AutoContigo",...}' style="font-family:ui-monospace,monospace;font-size:12px"></textarea><div class="ferr" id="impErr"></div>
  <div class="row-flex" style="justify-content:flex-end;margin-top:14px"><button class="btn soft" onclick="closeSheet()">Cancelar</button><button class="btn primary" onclick="doImport()">Importar</button></div>`)}
function doImport(){try{const j=JSON.parse($("#imp").value),d=j.db||j;if(!d.vehicles)throw 0;db=ensureDb(d);db.onboarded=true;closeSheet();commit();toast("Datos importados")}catch{$("#impErr").textContent="El contenido no es una copia válida de AutoContigo."}}
function wipeData(){confirmSheet("Borrar mis datos","Se eliminarán vehículos, servicios, gastos, documentos y recorridos de esta cuenta. Tu cuenta seguirá activa.","Borrar todo",()=>{if(tracking())stopTrack(false);db=emptyDB(newVehicle());persist();nav("onboarding");toast("Datos borrados")})}
function deleteAccount(){confirmSheet("Eliminar cuenta","Se borrarán tu cuenta y todos tus datos de este navegador. No se puede deshacer.","Eliminar cuenta",()=>{const u=getUsers();delete u[session.email];setUsers(u);LS.del(dbKey());logout()})}
function pwSheet(){sheet("Cambiar contraseña",`<div class="stack"><label class="field"><span>Contraseña actual</span><input class="inp" id="pw0" type="password" autocomplete="current-password"></label><label class="field"><span>Nueva contraseña</span><input class="inp" id="pw1" type="password" autocomplete="new-password" placeholder="Mínimo 6 caracteres"></label></div><div class="ferr" id="pwErr"></div>
  <div class="row-flex" style="justify-content:flex-end;margin-top:16px"><button class="btn soft" onclick="closeSheet()">Cancelar</button><button class="btn primary" onclick="savePw()">Guardar</button></div>`)}
async function savePw(){const u=getUsers(),me=u[session.email],p0=$("#pw0").value,p1=$("#pw1").value;
  if((await sha(p0,me.salt))!==me.hash){$("#pwErr").textContent="La contraseña actual no coincide.";return}
  if(p1.length<6){$("#pwErr").textContent="La nueva contraseña debe tener al menos 6 caracteres.";return}
  me.salt=newSalt();me.hash=await sha(p1,me.salt);setUsers(u);closeSheet();toast("Contraseña actualizada")}

/* ---- Más ---- */
SCREENS.more=function(){
  const items=[["documents","Documentos","doc","Vencimientos y renovaciones"],["diagnostic","Diagnóstico","gauge","Estado general"],["learn","Aprende","book","Lecciones y luces del tablero"],["nearby","Cerca de mí","pin","Talleres y servicios"],["routes","Rutas","route","Planea tu viaje"],["equipment","Equipamiento","list","Checklist de emergencia"],["parking","Estacionamiento","parking","Dónde lo dejé"],["vehicles","Mis vehículos","car","Garaje y fichas"],["profile","Perfil y datos","user","Cuenta y copias"],["emergency","Emergencia","alert","Ayuda inmediata"]];
  return`${phead("Más herramientas")}<div class="grid g2 keep">${items.map(([id,t,i,s])=>`<a class="tile" href="#${id}" style="${id==="emergency"?"color:var(--bad)":""}">${ic(i,26)}<span>${t}</span><span class="xs mut" style="font-weight:400">${s}</span></a>`).join("")}</div>`;
};
SCREENS.emergency=function(){return`${phead("Modo emergencia","Accesos rápidos para cuando algo sale mal en la vía.")}${emergencyBody()}`};

/* ============ Inicio de la aplicación ============ */
function init(){
  const t=LS.get("ac_theme");if(t)document.documentElement.setAttribute("data-theme",t);
  const s=readSession();
  if(s&&s.email){const users=getUsers();if(users[s.email]||s.demo){session=s;const raw=readJSON(dbKey(),null);db=raw?ensureDb(raw):(s.demo?sampleDB():emptyDB(newVehicle()));persist()}}
  window.addEventListener("hashchange",render);
  document.addEventListener("visibilitychange",()=>{if(!document.hidden&&session&&route()==="parking")render()});
  window.addEventListener("beforeunload",()=>{try{persist()}catch{}});
  render();
}

init();
</script>
